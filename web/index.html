<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoGrid Flow</title>
    <link rel="stylesheet" href="style.css">

  
</head>

<body>

    <!-- Шапка -->
    <header class="header">
        <div class="logo">
            EcoGrid <span class="caligraf"> Flow </span>
        </div>

        <nav class="navigation">
            <a href="#">Главная</a>
            <a href="#">Аналитика</a>
            <a href="#">Карта ЦОД</a>
        </nav>
    </header>
    


    <!-- Основная часть страницы -->
    <main class="main">

        <!-- Форма создания задачи -->
        <section class="task-form-container">

            <h1>Параметры задачи</h1>

            <p class="description">
                Прототип формы. Расчёт станет доступен после подключения сервиса рекомендаций.
            </p>


            <form id="taskForm">

                <!-- Идентификатор задачи -->
                <div class="form-group">

                    <label for="job_id">
                        Идентификатор задачи
                    </label>

                    <input
                        type="text"
                        id="job_id"
                        name="job_id"
                        placeholder="Например: training-001"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- Длительность и дедлайн -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="duration">
                            Длительность вычислений, минуты
                        </label>

                        <input
                            type="number"
                            id="duration"
                            name="duration_minutes"
                            min="1"
                            placeholder="90"
                            step="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Дедлайн выполнения (UTC)
                        </label>

                        <input
                            type="datetime-local"
                            id="deadline"
                            name="deadline"
                            required
                        >

                    </div>

                </div>


                <!-- Мощность -->
                <div class="form-group">

                    <label for="power">
                        Потребляемая мощность серверов, кВт
                    </label>

                    <input
                        type="number"
                        id="power"
                        name="required_power_kw"
                        min="0.01"
                        step="any"
                        placeholder="10"
                        required
                    >

                </div>


                <!-- Регионы -->
                <div class="form-group">

                    <p class="regions-title">
                        Доступные регионы / ЦОД
                    </p>


                    <div class="regions">

                        <label class="region">

                            <input
                                type="checkbox"
                                name="allowed_zones"
                                value="FI"
                            >

                            Финляндия

                        </label>


                        <label class="region">

                            <input
                                type="checkbox"
                                name="allowed_zones"
                                value="SE3"
                            >

                            Швеция

                        </label>


                        <label class="region">

                            <input
                                type="checkbox"
                                name="allowed_zones"
                                value="DE-LU"
                            >

                            Германия

                        </label>

                    </div>

                </div>


                <!-- Кнопка -->
                <button type="button" class="submit-button" disabled>

                    Расчёт пока недоступен

                </button>

            </form>

        </section>


        <!-- Место для будущего графика -->
        <section class="content-placeholder">

            <h2>
                Оптимизация вычислений
            </h2>

            <p>
                Здесь позже будет отображаться график стоимости
                электроэнергии и результаты расчёта.
            </p>

        </section>

    </main>


    <!-- Подключение к API будет добавлено вместе с обработчиком рекомендаций. -->

</body>
</html>
